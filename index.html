  <style>

  <script>
    /* Animated falling network: lightweight canvas, adapts to mobile screens */
    (() => {
      const canvas = document.getElementById('network');
      const ctx = canvas.getContext('2d', { alpha: true });
      let width = 0, height = 0, dpr = 1, points = [], last = performance.now();
      const colors = [
        [255, 49, 88], [157, 77, 255], [255, 123, 65], [103, 91, 255]
      ];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.6);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.max(22, Math.min(58, Math.floor(width * height / 10500)));
        points = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: .8 + Math.random() * 1.6,
          speed: 6 + Math.random() * 12,      /* px per second (slow) */
          drift: (Math.random() - .5) * 4,   /* px per second */
          phase: Math.random() * Math.PI * 2,
          color: colors[Math.floor(Math.random() * colors.length)]
        }));
      }
      function draw(now) {
        const dt = reducedMotion ? 0 : Math.min((now - last) / 1000, .05);
        last = now;
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          if (!reducedMotion) {
            p.y += p.speed * dt;
            p.x += (p.drift + Math.sin(p.phase) * 3) * dt;
            p.phase += .45 * dt;
            if (p.y > height + 8) { p.y = -8; p.x = Math.random() * width; }
            if (p.x < -8) p.x = width + 8;
            if (p.x > width + 8) p.x = -8;
          }
          for (let j = i + 1; j < points.length; j++) {
            const q = points[j];
            const dx = p.x - q.x, dy = p.y - q.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = Math.min(118, width * .27);
            if (distance < maxDistance) {
              const alpha = (1 - distance / maxDistance) * .26;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(q.x, q.y);
              ctx.strokeStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha})`;
              ctx.lineWidth = .7;
              ctx.stroke();
            }
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},.8)`;
          ctx.shadowBlur = 9;
          ctx.shadowColor = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},.5)`;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        if (!reducedMotion) requestAnimationFrame(draw);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();
      draw(performance.now());
    })();
